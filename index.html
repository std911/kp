<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STUDIO 911 — Проекты</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#0a0a0b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230a0a0b'/%3E%3Ctext x='50' y='68' font-family='Helvetica,Arial' font-size='42' font-weight='700' fill='%23fff' text-anchor='middle'%3E911%3C/text%3E%3C/svg%3E">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --dark:#0a0a0b; --dark-2:#141416; --red-l:#ff4a52; --stone:#8e9095;
  --pad:clamp(20px,5vw,80px);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);background:var(--dark);color:#fff;line-height:1.55;
  -webkit-font-smoothing:antialiased;min-height:100vh;
  display:flex;flex-direction:column;
  background-image:radial-gradient(60% 50% at 70% 0%,rgba(196,13,24,.16),transparent 70%);
}
a{color:inherit;text-decoration:none}
.wrap{width:100%;max-width:1000px;margin:0 auto;padding:0 var(--pad)}
header{padding:clamp(36px,7vw,80px) 0 0}
.mark{font-size:clamp(38px,7vw,68px);font-weight:700;letter-spacing:-.04em;line-height:1}
.cap{margin-top:14px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#7b7e84}
main{flex:1;padding:clamp(44px,8vw,96px) 0}
.rule{height:1px;background:rgba(255,255,255,.12)}
.item{
  display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:clamp(14px,3vw,32px);
  align-items:baseline;padding:clamp(24px,4vw,38px) 0;
  border-bottom:1px solid rgba(255,255,255,.12);
  transition:opacity .4s cubic-bezier(.16,1,.3,1);
}
.item:first-of-type{border-top:1px solid rgba(255,255,255,.12)}
.item .i{font-size:12px;letter-spacing:.14em;color:#7b7e84}
.item h2{font-size:clamp(24px,4.2vw,42px);font-weight:600;letter-spacing:-.03em;line-height:1.05}
.item p{margin-top:10px;font-size:15px;color:#a9abb0;max-width:52ch}
.item .go{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--red-l);white-space:nowrap}
.item:hover h2{color:var(--red-l)}
@media(max-width:640px){
  .item{grid-template-columns:minmax(0,1fr);gap:8px}
  .item .go{margin-top:8px}
}
footer{padding:0 0 clamp(30px,6vw,60px);font-size:12.5px;color:#7b7e84}
footer a{border-bottom:1px solid rgba(255,255,255,.22)}
</style>
</head>
<body>

<header><div class="wrap">
  <div class="mark">911</div>
  <div class="cap">Студия 911 · Проекты</div>
</div></header>

<main><div class="wrap">
  <a class="item" href="coldi/">
    <span class="i">01</span>
    <div>
      <h2>Макет проектов КОЛДИ</h2>
      <p>Модульный макет Москвы с 25 объектами девелопера для парадного холла: гексагональные соты, карта 1:5800, контурная подсветка.</p>
    </div>
    <span class="go">Смотреть →</span>
  </a>
</div></main>

<footer><div class="wrap">
  STUDIO 911 · <a href="tel:+74950010911">+7 (495) 001-0-911</a> · <a href="https://std911.ru" target="_blank" rel="noopener">std911.ru</a>
</div></footer>

</body>
</html>
