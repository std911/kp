function cvs(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=8;return t;}
const winTex=cvs(128,512,(g,w,h)=>{g.fillStyle='#000';g.fillRect(0,0,w,h);for(let y=0;y<64;y++)for(let x=0;x<8;x++){if(rnd()<.55){const b=.55+rnd()*.45;g.fillStyle=`rgba(255,${200+rnd()*40|0},${140+rnd()*60|0},${b})`;g.fillRect(x*16+3,y*8+2,10,4);}}});
winTex.wrapS=winTex.wrapT=THREE.RepeatWrapping;
const callTex=cvs(512,128,(g,w,h)=>{g.fillStyle='#000';g.fillRect(0,0,w,h);g.strokeStyle='#fff';g.lineCap='round';for(let i=0;i<70;i++){g.lineWidth=1.5+rnd()*3;g.beginPath();let x=rnd()*w,y=20+rnd()*(h-40);g.moveTo(x,y);g.bezierCurveTo(x+rnd()*40-20,y-rnd()*30,x+rnd()*50,y+rnd()*30,x+20+rnd()*40,y+rnd()*16-8);g.stroke();}});
callTex.wrapS=callTex.wrapT=THREE.RepeatWrapping; callTex.repeat.set(3,1);

function topTex(kind){
  return cvs(512,512,(g,w,h)=>{
    const C=w/2;
    if(kind==='water'){g.fillStyle='#0a2f3c';g.fillRect(0,0,w,h);g.strokeStyle='rgba(120,210,230,.10)';for(let i=0;i<160;i++){g.lineWidth=1+rnd()*2;g.beginPath();const x=rnd()*w,y=rnd()*h;g.arc(x,y,6+rnd()*26,PI*1.1,PI*1.9);g.stroke();}return;}
    if(kind==='desert'){const gr=g.createLinearGradient(0,0,w,h);gr.addColorStop(0,'#6e4f2a');gr.addColorStop(1,'#8a6a40');g.fillStyle=gr;g.fillRect(0,0,w,h);for(let i=0;i<40;i++){g.strokeStyle=`rgba(90,55,20,${.08+rnd()*.12})`;g.lineWidth=2+rnd()*5;g.beginPath();const y=rnd()*h;g.moveTo(0,y);g.bezierCurveTo(w*.3,y+rnd()*60-30,w*.6,y+rnd()*60-30,w,y+rnd()*40-20);g.stroke();}return;}
    if(kind==='empty'){g.fillStyle='#101216';g.fillRect(0,0,w,h);g.strokeStyle='rgba(226,182,92,.10)';g.lineWidth=1;for(let i=0;i<=w;i+=24){g.beginPath();g.moveTo(i,0);g.lineTo(i,h);g.stroke();g.beginPath();g.moveTo(0,i);g.lineTo(w,i);g.stroke();}return;}
    // land base
    g.fillStyle='#4f4838';g.fillRect(0,0,w,h);
    for(let i=0;i<2500;i++){g.fillStyle=`rgba(${rnd()<.5?0:255},${rnd()<.5?0:255},${rnd()<.5?0:200},.04)`;g.fillRect(rnd()*w,rnd()*h,2,2);}
    for(let i=0;i<18;i++){g.fillStyle=`rgba(${34+rnd()*14|0},${66+rnd()*24|0},${34+rnd()*10|0},.9)`;g.beginPath();g.ellipse(rnd()*w,rnd()*h,20+rnd()*60,14+rnd()*40,rnd()*PI,0,PI*2);g.fill();}
    if(kind==='creek'||kind==='marina'){g.fillStyle='#0b3442';
      if(kind==='creek'){g.fillRect(0,C-58,w,116);}else{g.beginPath();g.moveTo(C-40,0);g.bezierCurveTo(C+90,h*.35,C-120,h*.6,C+20,h);g.lineTo(C+90,h);g.bezierCurveTo(C-50,h*.6,C+160,h*.35,C+30,0);g.closePath();g.fill();}}
    // roads
    const road=(pts)=>{g.lineJoin='round';g.strokeStyle='#1c1c1f';g.lineWidth=18;g.beginPath();pts.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.stroke();g.setLineDash([10,9]);g.strokeStyle='#e2ad2a';g.lineWidth=2.5;g.stroke();g.setLineDash([]);};
    const a=rnd()*PI;
    road([[C+Math.cos(a)*400,C+Math.sin(a)*400],[C-Math.cos(a)*400,C-Math.sin(a)*400]]);
    road([[C+Math.cos(a+1.6)*400,C+Math.sin(a+1.6)*400],[C+Math.cos(a+1.6)*60,C+Math.sin(a+1.6)*60],[C-Math.cos(a+.9)*400,C-Math.sin(a+.9)*400]]);
  });
}

// ───────── HELPERS ─────────
function sh(m){m.castShadow=m.receiveShadow=true;return m;}
function box(w,h,d,mat,x=0,y=0,z=0,ry=0){const m=sh(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat));m.position.set(x,y+h/2,z);m.rotation.y=ry;return m;}
function cyl(rt,rb,h,mat,x=0,y=0,z=0,seg=16){const m=sh(new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat));m.position.set(x,y+h/2,z);return m;}
function rod(a,b,r,mat){const d=new THREE.Vector3().subVectors(b,a);const L=d.length();const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,L,6),mat);m.position.copy(a).addScaledVector(d,.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());m.castShadow=true;return m;}
function inHex(x,z,s){const ax=Math.abs(x),az=Math.abs(z);return ax<=s*S3/2&&az<=s-ax/S3;}
function hexBand(zMin,mat){ // plate covering part of hex with z>zMin
  const a=R*S3/2*.995, s=R*.995;
  const sh_=new THREE.Shape();sh_.moveTo(a,zMin);sh_.lineTo(a,s/2);sh_.lineTo(0,s);sh_.lineTo(-a,s/2);sh_.lineTo(-a,zMin);sh_.closePath();
  const g=new THREE.ExtrudeGeometry(sh_,{depth:.035,bevelEnabled:false});g.rotateX(PI/2);g.translate(0,.035,0);
  return sh(new THREE.Mesh(g,mat));
}
function twisted(w,h,turn,mat,x,z){const g=new THREE.BoxGeometry(w,h,w,1,24,1);const p=g.attributes.position;for(let i=0;i<p.count;i++){const y=p.getY(i),a=(y/h+.5)*turn,X=p.getX(i),Z=p.getZ(i);p.setX(i,X*Math.cos(a)-Z*Math.sin(a));p.setZ(i,X*Math.sin(a)+Z*Math.cos(a));}g.computeVertexNormals();const m=sh(new THREE.Mesh(g,mat));m.position.set(x,h/2,z);return m;}
function dashes(points,mat,y=.012,len=.2,gap=.14,w=.035,closed=false){
  const segs=[];const P=points.map(p=>new THREE.Vector2(p[0],p[1]));const n=closed?P.length:P.length-1;
  for(let i=0;i<n;i++){const a=P[i],b=P[(i+1)%P.length];const d=b.clone().sub(a);const L=d.length();const ang=Math.atan2(d.y,d.x);for(let s=0;s<L;s+=len+gap){const e=Math.min(s+len,L);segs.push([a.x+d.x/L*(s+e)/2,a.y+d.y/L*(s+e)/2,e-s,ang]);}}
  const geo=new THREE.PlaneGeometry(1,w);geo.rotateX(-PI/2);
  const im=new THREE.InstancedMesh(geo,mat,segs.length);const o=new THREE.Object3D();
  segs.forEach((s,i)=>{o.position.set(s[0],y,s[1]);o.rotation.set(0,-s[3],0);o.scale.set(s[2],1,1);o.updateMatrix();im.setMatrixAt(i,o.matrix);});
  return im;
}

  g.putImageData(d,0,0);const tx=new THREE.CanvasTexture(c);tx.anisotropy=8;
  const asp=img.width/img.height;
  const mk=(w,x,y,z,ry)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,w/asp),new THREE.MeshBasicMaterial({map:tx,transparent:true,fog:false,color:new THREE.Color(1,1,1).multiplyScalar(1.25)}));m.position.set(x,y,z);m.rotation.y=ry;room.add(m);
    const bk=new THREE.Mesh(new THREE.PlaneGeometry(w*1.12,w/asp*2.2),new THREE.MeshStandardMaterial({color:0x0c0c0e,roughness:.4,metalness:.6}));bk.position.set(x,y,z);bk.rotation.y=ry;bk.translateZ(-.05);room.add(bk);};
  mk(44,-6,10.5,-49.8,0);mk(44,-49.8,10.5,-4,PI/2);
});
// стены как на рендерах: чёрные панели и вертикальные световые полосы
const ledV=new THREE.MeshBasicMaterial({color:new THREE.Color(1,.97,.92).multiplyScalar(1.5),fog:false});
for(let k=-8;k<=8;k++){const u=k*6;
  [[u,-49.9,0],[-49.9,u,1],[u,49.9,0],[49.9,u,1]].forEach(([x,z,side])=>{const m=new THREE.Mesh(new THREE.BoxGeometry(side?.05:.1,12,side?.1:.05),ledV);m.position.set(x,7,z);room.add(m);});}
// потолок: фермы со споты вместо светящихся линий
const trussM=new THREE.MeshStandardMaterial({color:0x1a1b1f,roughness:.6,metalness:.5});
for(let k=-4;k<=4;k++){const t=new THREE.Mesh(new THREE.BoxGeometry(80,.35,.35),trussM);t.position.set(-1,16,k*8-1);room.add(t);
  for(let q=-6;q<=6;q++){const sp=new THREE.Mesh(new THREE.CylinderGeometry(.12,.16,.4,10),trussM);sp.position.set(q*6-1,15.65,k*8-1);room.add(sp);
    const g=new THREE.Mesh(new THREE.CircleGeometry(.11,12),ledV);g.rotation.x=PI/2;g.position.set(q*6-1,15.44,k*8-1);room.add(g);}}
// ───────── PANORAMA (generated 360) ─────────
let pano=null, panoOn=false;
new THREE.TextureLoader().load('env/showroom-360.jpg',tx=>{tx.mapping=THREE.EquirectangularReflectionMapping;pano=tx;const b=$('#bPano');b.style.display='';},undefined,()=>{});
function setPano(on){panoOn=on&&!!pano;room.visible=!panoOn;scene.background=panoOn?pano:scene.background.isColor?scene.background:BG_N.clone();if(!panoOn&&!scene.background.isColor)scene.background=BG_N.clone();scene.fog.far=panoOn?400:120;$('#bPano').classList.toggle('on',panoOn);$('#bRoom').classList.toggle('on',!panoOn);}
$('#bPano').onclick=()=>setPano(true);$('#bRoom').onclick=()=>setPano(false);

// ───────── POST ─────────
const composer=new THREE.EffectComposer(renderer);
composer.addPass(new THREE.RenderPass(scene,camera));
const bloom=new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.0,.5,.7);composer.addPass(bloom);
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);composer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();mirror.getRenderTarget&&mirror.getRenderTarget().setSize(w*DPR*.8,h*DPR*.8);}
addEventListener('resize',resize);resize();

// ───────── DAY / NIGHT ─────────
let K=0,Kt=0;
function applyK(k){
  hemi.intensity=lerp(.28,.55,k);hemi.color.setRGB(lerp(.62,1,k),lerp(.7,1,k),lerp(.85,1,k));hemi.groundColor.setRGB(lerp(.1,.35,k),lerp(.08,.33,k),lerp(.05,.3,k));
  key.intensity=lerp(.5,1.1,k);key.color.setRGB(lerp(.62,1,k),lerp(.69,.97,k),lerp(.85,.92,k));
  fill.intensity=lerp(0,.55,k);rimL.intensity=lerp(0,.9,k);top_.intensity=lerp(0,.35,k);
  warm.intensity=lerp(.7,.15,k);
  // стекло днём: меньше зеркала, больше собственного цвета
  [M.glass,M.glassB].forEach((m,i)=>{m.metalness=lerp(.75,.45,k);m.roughness=lerp(.22,.16,k);m.envMapIntensity=lerp(1,1,k);m.emissiveIntensity=lerp(1,.22,k);});
  Mwin.emissiveIntensity=lerp(1,.2,k);Mcream.emissiveIntensity=lerp(.25,.02,k);
  M.glass.color.setRGB(lerp(.36,.55,k),lerp(.4,.62,k),lerp(.45,.72,k));
  M.glassB.color.setRGB(lerp(.24,.38,k),lerp(.33,.55,k),lerp(.41,.7,k));
  scene.environment=k>.5?ENV_D:ENV_N;M.gold.envMapIntensity=lerp(1,1.2,k);M.steel.envMapIntensity=lerp(1,1.15,k);M.steel.metalness=lerp(.95,.85,k);
  M.steel.emissiveIntensity=lerp(.9,.1,k);M.arab.emissiveIntensity=lerp(.3,.04,k);M.arab.color.setScalar(lerp(.95,.78,k));
  M.side.color.setRGB(lerp(.165,.23,k),lerp(.172,.235,k),lerp(.19,.25,k));
  M.rim.color.setScalar(lerp(1.15,.85,k));
  bloom.strength=lerp(.95,.22,k);bloom.threshold=lerp(.7,.85,k);
  if(scene.background.isColor)scene.background.lerpColors(BG_N,BG_D,k);
  scene.fog.color.lerpColors(BG_N,BG_D,k);
  walls.material.color.setRGB(lerp(.03,.14,k),lerp(.034,.14,k),lerp(.04,.15,k));
  floor.material.color.setScalar(lerp(.2,.36,k));
  strips.forEach(s=>s.visible=false);
}
$('#bDay').onclick=()=>{Kt=Kt?0:1;$('#bDay').textContent=Kt?L('day'):L('night');$('#bDay').classList.toggle('on',!!Kt);};

// ───────── LABELS / DOCK / PANEL ─────────
const labelsEl=$('#labels');
TILES.forEach(T=>{const d=document.createElement('div');d.className='lb'+(T.gold?' gold':'');d.innerHTML=T.lbl+(T.sub?'<small>'+T.sub+'</small>':'');d.onclick=()=>select(T.id);labelsEl.appendChild(d);tiles[T.id].lb=d;
  const b=document.createElement('button');b.className='pk'+(T.gold?' add':'');b.textContent=T.code;b.title=T.lbl;b.onclick=()=>{stopTour();select(T.id);};$('#dock').appendChild(b);tiles[T.id].pk=b;});
let sel=null;
const cam={from:null,to:null,tf:null,tt:null,k:1};
function flyTo(pos,tgt){cam.from=camera.position.clone();cam.tf=controls.target.clone();cam.to=pos;cam.tt=tgt;cam.k=0;}
function select(id){
  if(sel)tiles[sel].rim.material=M.rim;
  sel=id;const t=tiles[id],T=t.T;t.rim.material=M.rimSel;
  Object.values(tiles).forEach(o=>{o.pk.classList.toggle('on',o.T.id===id);o.lb.classList.toggle('dim',o.T.id!==id);});
  const c=t.base.clone().setY((T.h+T.lh*.3)*SC);
  let dir=camera.position.clone().sub(controls.target).setY(0).normalize();if(dir.lengthSq()<.1)dir.set(.6,0,.8);
  const dist=(innerWidth<760?7.5:6.2+T.lh*.9)*SC;
  const pos=c.clone().addScaledVector(dir,dist).setY(c.y+dist*.62);
  if(innerWidth<760){c.y-=1.5*SC;pos.y-=1.5*SC;}
  if(innerWidth>=760){const right=new THREE.Vector3().crossVectors(dir,new THREE.Vector3(0,1,0)).normalize();c.addScaledVector(right,-1.1*SC);pos.addScaledVector(right,-1.1*SC);}
  flyTo(pos,c);
  spot.position.copy(t.base).add(new THREE.Vector3(.6,13,.6));spot.target.position.copy(t.base);
  fillPanel(T);$('#panel').classList.add('open');document.body.classList.add('sel');
  $('#pAct').hidden=id!=='slot';if(id==='slot'){SLOT.kt=0;setTimeout(()=>{if(sel==='slot'){SLOT.kt=1;slotBtn();}},1300);slotBtn();}
}
function deselect(){if(sel)tiles[sel].rim.material=M.rim;sel=null;$('#panel').classList.remove('open');document.body.classList.remove('sel');Object.values(tiles).forEach(o=>{o.pk.classList.remove('on');o.lb.classList.remove('dim');});flyTo(HOME.pos.clone(),HOME.tgt.clone());}
function slotBtn(){$('#pAct').textContent=SLOT.kt?L('take'):L('put');}
function fillPanel(T){const e=LANG==='en'?EN[T.id]:T;const P=$('#panel');P.classList.toggle('slot',!!T.gold);$('#pY').textContent=e.yr;$('#pN').textContent=T.name;$('#pR').textContent=e.ru;$('#pT').textContent=e.txt;$('#pTT').textContent=L('studio');
  $('#pC').innerHTML=e.tech.concat(T.screen?[L('screen')]:[]).map(s=>`<span>${s}</span>`).join('');}
function setLang(l){LANG=l==='en'?'en':'ru';document.documentElement.lang=LANG;$('#bDay').textContent=Kt?L('day'):L('night');$('#bTour').textContent=tourTimer?L('stop'):L('tour');$('#bRoom').textContent=L('room');$('#bHome').textContent=L('home');
  $('.hint').textContent=matchMedia('(hover:none)').matches?L('hintT'):L('hintM');slotBtn();$('#bLang').textContent=LANG==='en'?'RU':'EN';if(sel)fillPanel(tiles[sel].T);}
$('#bLang').onclick=()=>setLang(LANG==='en'?'ru':'en');
addEventListener('message',e=>{if(e.data&&e.data.lang)setLang(e.data.lang);});
$('#pAct').onclick=()=>{SLOT.kt=SLOT.kt?0:1;slotBtn();};
$('#pX').onclick=()=>{stopTour();deselect();};$('#bHome').onclick=()=>{stopTour();deselect();};
addEventListener('keydown',e=>{if(e.key==='Escape'){stopTour();deselect();}});
// tour
let tourI=-1,tourTimer=null;
function stopTour(){clearInterval(tourTimer);tourTimer=null;$('#bTour').classList.remove('on');$('#bTour').textContent=L('tour');}
$('#bTour').onclick=()=>{if(tourTimer){stopTour();return;}$('#bTour').classList.add('on');$('#bTour').textContent=L('stop');const step=()=>{tourI=(tourI+1)%TILES.length;select(TILES[tourI].id);};step();tourTimer=setInterval(step,6500);};

// picking
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();let down=null,hover=null;
function pick(e){mv.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mv,camera);const h=ray.intersectObjects(pickables,true)[0];return h?h.object.userData.tile:null;}
canvas.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];cam.k=1;});
canvas.addEventListener('pointerup',e=>{if(!down)return;const d=Math.hypot(e.clientX-down[0],e.clientY-down[1]);down=null;if(d<6){const id=pick(e);if(id){stopTour();select(id);}}});
canvas.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||down)return;const id=pick(e);if(id!==hover){if(hover&&hover!==sel)tiles[hover].rim.material=M.rim;hover=id;if(id&&id!==sel)tiles[id].rim.material=M.rimSel;canvas.style.cursor=id?'pointer':'grab';}});
canvas.addEventListener('wheel',()=>{cam.k=1;},{passive:true});

// ───────── LOOP ─────────
const clock=new THREE.Clock();const v=new THREE.Vector3();
function frame(){
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  K=lerp(K,Kt,.06);applyK(K);
  anim.forEach(f=>f(t,dt));
  M.dot.color.setRGB(.31,.89,.94).multiplyScalar(lerp(1.5,.8,K)*(.75+.25*Math.sin(t*2.4)));
  Object.values(tiles).forEach(o=>{const target=0;o.lift=lerp(o.lift,target,.08);o.g.position.y=o.lift;});
  spot.intensity=lerp(spot.intensity,sel?lerp(.9,.5,K):0,.08);
  if(cam.k<1){cam.k=Math.min(1,cam.k+dt/1.6);const e=cam.k<.5?4*cam.k**3:1-Math.pow(-2*cam.k+2,3)/2;camera.position.lerpVectors(cam.from,cam.to,e);controls.target.lerpVectors(cam.tf,cam.tt,e);}
  else if(!sel&&!down&&!tourTimer&&!window.__still){controls.autoRotate=true;controls.autoRotateSpeed=.25;}
  if(sel||down||tourTimer)controls.autoRotate=false;
  controls.update();
  // labels
  const W=innerWidth,H=innerHeight;
  Object.values(tiles).forEach(o=>{v.copy(o.base).setY(o.T.h+o.lift+o.T.lh);v.project(camera);const vis=v.z<1&&Math.abs(v.x)<1.1&&Math.abs(v.y)<1.1;o.lb.style.display=vis?'block':'none';if(vis)o.lb.style.transform=`translate(${(v.x*.5+.5)*W}px,${(-v.y*.5+.5)*H}px) translate(-50%,-100%)`;});
  composer.render();
  requestAnimationFrame(frame);
}
applyK(0);frame();
setLang(LANG);
setTimeout(()=>$('.hint').classList.add('off'),7000);
if(new URLSearchParams(location.search).has('embed'))document.body.classList.add('embed');
const Q=new URLSearchParams(location.search);
if(Q.has('clean'))document.querySelectorAll('header,.ctl,#dock,.hint,#panel,#labels').forEach(e=>e.style.display='none');
if(Q.has('day')){Kt=K=1;applyK(1);}
if(Q.has('placed'))SLOT.kt=SLOT.k=1;
if(Q.has('cam')){const c=Q.get('cam').split(',').map(Number);HOME.pos.set(c[0],c[1],c[2]);HOME.tgt.set(c[3],c[4],c[5]);camera.position.copy(HOME.pos);controls.target.copy(HOME.tgt);controls.autoRotate=false;window.__still=true;}
setTimeout(()=>$('#load').classList.add('hide'),300);
})();
</script>
</body>
</html>
